  <circle cx="100" cy="72" r="16" fill="#0284c7" />
  <circle cx="100" cy="72" r="9" fill="#0b1736" />
  <circle cx="105" cy="67" r="4" fill="#ffffff" />

  <!-- Spectacle Frame Below Eye -->
